[project]
name = "python-container-template"
requires-python = ">=3.14"
classifiers = ["Programming Language :: Python :: 3.14"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PL"]
ignore = ["E203", "E501"]

[tool.ruff.format]

[tool.bandit]
exclude_dirs = ["src/tests", "tests", "**/test_*"]
skips = ["B101", "B105"]
